<section class="charts-terminal" id="trend-charts-terminal" data-nav-strategy="trend">
  <div class="charts-terminal-head">
    <div>
      <p class="meta"><a href="/view/trend-signal">← сигнал Trend</a></p>
      <h2>Терминал графиков · Trend</h2>
      <p class="meta" id="charts-terminal-meta">Раскладки сохраняются под вашим логином (data/chart-layouts).</p>
    </div>
    <div class="charts-terminal-actions">
      <button type="button" class="btn btn-ghost" id="charts-fit">Весь график</button>
      <button type="button" class="btn btn-ghost" id="charts-refresh">Обновить</button>
      <button type="button" class="btn btn-ghost" id="charts-exit-fs" hidden>Выйти из полного экрана</button>
    </div>
  </div>
  <div class="charts-terminal-toolbar">
    <label class="check-label">Инструмент
      <select id="charts-instrument"></select>
    </label>
    <button type="button" class="btn btn-ghost" id="charts-tool-vap" aria-pressed="false">Натянуть профиль</button>
    <button type="button" class="btn btn-ghost" id="charts-tool-trend" aria-pressed="false">Линия тренда</button>
    <button type="button" class="btn btn-ghost" id="charts-tool-ma">MA…</button>
    <button type="button" class="btn btn-ghost" id="charts-tool-clear">Сброс рисунков</button>
    <button type="button" class="btn" id="charts-fullscreen">Полный экран панели</button>
  </div>
  <div class="charts-terminal-grid" id="charts-terminal-grid" aria-label="Графики инструментов"></div>
</section>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/js/trinity-chart-kit.js?v=20260817-ohlc-l"></script>
<script src="/js/trend-charts-terminal.js?v=20260817-archive"></script>
