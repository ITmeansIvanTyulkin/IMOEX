imoex:
  base-url: https://iss.moex.com/iss
  board: TQBR
  index: IMOEX
  history-years: 5
  commission-rate: 0.0005
  cointegration:
    p-value-threshold: 0.05
    z-score-entry: 2.0
    z-score-exit: 0.0
    top-n: 10
    use-rolling-z: true
    rolling-z-window: 60
    fdr-q: 0.20
    use-kalman-hedge: true
    kalman-delta: 0.00001
    kalman-ve: 0.001
    # true = вход только после разворота Z за порогом (не на первом касании ±2)
    require-entry-reversal: true
  data-dir: data
  charts-dir: data/charts
  # Labeled engine corpus (training). Not UI. Folder is gitignored; upload later.
  research-corpus-dir: research-corpus
  research-corpus:
    enabled: true
  news:
    enabled: true
    lookback-days: 10
    stale-candle-days: 10
    max-news-pages: 8
    # FA только после техники и только в DAILY; RSS — контекст UI + триггер-матчер
    rss-enabled: true
    rss-max-items: 12
    # curated feeds (MOEX-relevant + внешний фон, который может двигать индекс)
    rss-feeds:
      - name: Interfax
        url: https://www.interfax.ru/rss.asp
      - name: RBC
        url: https://rssexport.rbc.ru/rbcnews/news/30/full.rss
      - name: Vedomosti
        url: https://www.vedomosti.ru/rss/news
    # legacy fallbacks, если rss-feeds пуст
    rss-interfax-url: https://www.interfax.ru/rss.asp
    rss-rbc-url: https://rssexport.rbc.ru/rbcnews/news/30/full.rss
  risk:
    stop-z: 3.5
    max-hold-bars: 40
    reduce-size-factor: 0.5
    # dual-book: слоты считает CapitalAllocator от equity (не этот ключ)
    max-open-pairs: 2
    max-portfolio-gross: 1.0
    min-sharpe: 0.0
    max-half-life-days: 90.0
    min-half-life-days: 1.0
    # торговый gate для боковика (research top-N может быть шире)
    trade-max-half-life-days: 15.0
    min-r-squared: 0.70
    min-trade-count: 8
    borrow-rate-annual: 0.08
    dynamic-sizing: true
    target-spread-sigma: 0.02
    min-size-mult: 0.25
    max-size-mult: 1.5
    partial-tp-fraction: 0.5
    trail-z: 0.75
    beta-break-pct: 0.35
    coint-p-break: 0.20
    adaptive-stop: true
    adaptive-stop-base: 2.5
    adaptive-stop-cap: 4.0
    cusum-enabled: true
    cusum-threshold: 5.0
    cusum-drift: 0.5
    cusum-lookback: 40
    min-coverage-percent: 85.0
  regime:
    enabled: true
    adx-period: 14
    adx-reduce: 20.0
    adx-block: 25.0
    reduce-factor: 0.5
    index-board: SNDX
  capital:
    # операторский профиль: 300 тыс. ₽ — pairs + оба trend playbook (fair-paper)
    equity-rub: 300000
    allow-leverage-above-rub: 1000000
    max-gross-when-no-leverage: 1.0
    # DAILY paper live; INTRADAY — research-only (доля 0)
    daily-gross-share: 1.0
    intraday-gross-share: 0.0
    # Focus-слоты: PAIRS | TREND_M5 | TREND_POSITIONAL | ARB | BALANCED
    # С 300к BALANCED разрешён: pairs + M5 + positional H1.
    focus-slot: BALANCED
    pairs-strategy-share: 0.40
    trend-m5-share: 0.30
    trend-positional-share: 0.30
    arb-share: 0.0
  session:
    # DUAL keeps dual-book code paths; operator cycle runs DAILY only (INTRADAY via runIntradayOnly).
    mode: DUAL
    candle-interval: 60
    hours-per-session: 7
    hourly-lookback-days: 90
    intraday-rolling-z-window: 48
    intraday-max-hold-bars: 7
    intraday-min-half-life-days: 0.25
    intraday-trade-max-half-life-days: 3.0
    pre-close-start: "18:30"
    pre-close-end: "18:45"
    session-open: "10:00"
    session-close: "18:45"
    prevent-weekend-hold: true
    intraday-journal-file: paper-journal-intraday.json
    event-calendar-enabled: true
    event-flatten-minutes-before: 45
    event-calendar-file: data/event-calendar.json
  walk-forward:
    enabled: true
    train-bars: 504
    test-bars: 63
    step-bars: 63
  paper:
    enabled: true
    # ~30к/нога: 1 пара ≈ 60к gross при β≈1, запас под 2-ю пару / издержки
    notional-per-leg: 30000
    notional-per-leg-pct: 0.30
    journal-file: paper-journal.json
    auto-run-daily: true
    # До открытия основной сессии (10:00 MSK): прогон по итогам предыдущего дня
    daily-cron: "0 55 9 * * MON-FRI"
    daily-cron-zone: Europe/Moscow
    # INTRADAY pairs: detached from operator UX / «Анализ + paper» / DAILY cron.
    # Research entrypoint remains runIntradayOnly + this cron (kept off).
    auto-run-intraday: false
    intraday-research-only: true
    intraday-cron: "0 5 10-18 * * MON-FRI"
    slippage-bps: 20
    slippage-bps-daily: 20
    slippage-bps-intraday: 40
    apply-borrow: true
  broker:
    enabled: false
    provider: T_INVEST
    mode: AUTO
    sandbox: true
    token: ${T_INVEST_TOKEN:}
    account-id: ${T_INVEST_ACCOUNT_ID:}
    auto-execute-after-analysis: true
    prefer-limit-orders: true
    allow-market-fallback: false
    emergency-market-exit-enabled: false
    passive-price-offset-bps: 15
    second-leg-timeout-seconds: 60
    max-leg-drift-bps: 35
    kill-switch: false
    # Channel-scoped SSL for T-Invest only (embedded Russian Trusted CA; not JVM cacerts).
    # Defaults to true when sandbox=true. Set true for live if Corretto lacks Russian Trusted CA.
    trust-all-ssl: true
  # Ежемесячный пересмотр кластеров: research всегда, в слоты — только чемпион
  cluster-review:
    enabled: true
    lookback-months: 6
    min-profit-factor: 1.10
    min-closed-trades: 4
    exclude-oil-gas: false
    champion-only: true
    sit-out-if-unproven: true
    min-quality-pairs: 2
    pair-min-closed-trades: 2
    pair-loss-streak: 2
  # Simulated SKU for operator UX locks (no billing). Override in Settings at runtime.
  # PAIRS | PAIRS_TREND | FULL
  product:
    edition: FULL
  # Soft upsell Full Core / calendar arbitrage (scaffolding, no billing)
  upsell:
    enabled: true
    overview-price-rub: 5000
    operator-price-rub: 7500
    full-price-rub: 15000
    cooldown-hours: 168
    min-events-before-prompt: 3
    min-dashboard-views: 2
    reverse-trial-days: 14
    auto-start-reverse-trial: true
    # Local/dev simulation (no billing): force trial active or expired
    simulate-trial-active: false
    simulate-trial-expired: false
  # Pre-filter до Engle–Granger: оборот / цена / preferred / сектора
  universe:
    enabled: true
    lookback-days: 60
    min-median-turnover-rub: 50000000   # тикерный floor
    min-price: 5.0
    max-zero-volume-fraction: 0.15
    exclude-preferred: true
    # только same-sector (нефть≠энергетика): чемпион не смешивается с related
    same-sector-only: true
    allow-related-sectors: false
    research-focus-sectors-only: true
    # обе ноги ≥ этого ADV; и ADV ratio ≤ max-turnover-ratio
    min-pair-turnover-rub: 50000000
    max-turnover-ratio: 20.0
    intraday-tier-one-only: true
  microstructure:
    enabled: true
    intraday-enabled: true
    min-relative-volume: 0.60
    max-spread-proxy-bps: 35
    min-leg-delta-alignment: 0.15
    max-leg-volume-ratio: 5.0
    session-open-skip-minutes: 15
    session-close-skip-minutes: 30
    volume-profile-lookback: 20
    block-outside-value-area: true
    dom-enabled: true
    min-dom-depth-rub: 300000
    max-dom-spread-bps: 25
    min-footprint-alignment: 0.20
    cluster-volume-mult: 2.0
    block-iceberg-suspect: true
    poc-partial-tp-enabled: true
    poc-proximity-bps: 15
    trend:
      enabled: false
      delta-momentum-threshold: 0.55
      value-area-breakout-min-bars: 3
      absorption-volume-mult: 2.5
      absorption-range-max-bps: 15
      breakout-delta-min: 0.60
      footprint-lookback-bars: 24
  portfolio:
    # чемпион уже один сектор — оба DAILY-слота можно занять внутри него
    diversify-by-sector: true
    max-pairs-per-sector: 2
  # Секреты НЕ в git: unlock + пароль только из env / application-local.yml
  run:
    unlock: ${IMOEX_UNLOCK:}
  auth:
    enabled: true
    username: imoex
    password: ${IMOEX_AUTH_PASSWORD:}
    api-key: ""
    # Shared IdP with trinity-landing cabinet (optional). See docs/AUTH_SUPABASE.md
    supabase:
      enabled: false
      url: ${SUPABASE_URL:}
      jwt-secret: ${SUPABASE_JWT_SECRET:}
      anon-key: ${SUPABASE_ANON_KEY:}
  # Short HTTP smoke after ApplicationReady (not full Maven suite).
  # FAIL → soft-block auto/live + retries; JVM stays up. See GET /api/ops/smoke
  smoke:
    on-startup: true
    retry-max: 5
    retry-delay-ms: 15000
  # Module feature flags (Maven modules trinity-pairs / trinity-trend / trinity-calendar-arb / trinity-marketdata)
  strategies:
    pairs:
      enabled: true
    trend:
      enabled: true
      auto-execution: true    # fair-paper live → SANDBOX_FAIR append to trend-paper-journal
      live-execution: false   # paper only — боевой FORTS SL позже
      # Max broker imitation on paper (FORMING_BAR + sim journal limits/PostStop; no live orders)
      broker-sim-max: true
      sandbox-broker-stop: true
      sandbox-broker-stop-dry-run: true   # paper: не слать в sandbox (PostStop там всё равно нельзя)
      sandbox-broker-stop-qty: 1
      # Exclusive-only while positional H1 (hvnHills) OOMs the JVM; restore both after fix
      playbook: levels-profile-br-m5
      parallel-playbooks: false
      desk-go-long-rub: 20000
      desk-go-short-rub: 22000
      grid: MODERATE
      max-risk-pct-equity: 1.0
      one-setup-per-zone: true
      unlock-distance-points: 40
      allow-zone-pad: false
      min-touch-count: 3              # A-setup: ≥3 real bounce clusters
      min-hvn-bands: 2
      session-bias-bars: 36
      session-bias-min-points: 40
      require-bounce-confirm: true
      min-reward-risk: 1.5
      max-setups-per-day: 4          # risk cap; 0 = unlimited
      cooldown-bars-after-sl: 12
      retest-arm-max-distance-points: 10
      a-setup-bounce-only: false     # full checklist: BOUNCE + RETEST after break+hold
      prefer-structural-entries: true  # map: HI/LO+ZERO+ACCUM; entries: only day TOP/BOT
      macro-bias-enabled: true         # smart macro: knife BUY/RETEST blocked; confirmed BOT bounce OK if HTF≠DOWN
      macro-min-day-move-points: 80
      min-shelf-volume: 30             # anti-thin: bar vol / tape lots floor for entry shelves
      max-day-loss-rub: 1500           # block new setups when realized day PnL ≤ −limit (0=off)
      gap-fill-enabled: true           # session open gap → trade toward prior close until filled
      gap-min-points: 20               # min |open−priorClose| in points to treat as a gap
      initial-size-fraction: 0.4     # ~⅓–½ size until BE
      prefer-marketdata-zones: true  # tape VAP when broker feed streaming
      trade-session-open: "10:00"      # основная сессия FORTS (не утренняя доп.)
      trade-session-close: "19:00"     # конец основной; вечер 19–23:50 не торгуем (тонкий рынок)
      no-trade-after-open-minutes: 20
      no-trade-before-close-minutes: 30  # новые сетапы до 18:30
      htf-min-move-points: 40          # calibrated: slightly earlier H1/M5 wind (was 50)
      htf-slope-bars: 24
      htf-require-agreement: true    # M5 proxy fallback only
      htf-aggregated-minutes: 60     # H1 from M5; 15=M15; 0=off (M5 proxy only)
      htf-aggregated-bars: 2         # calibrated: 2 completed H1 (faster than 3)
      counter-trend-size-fraction: 0.6
      counter-trend-min-reward-risk: 2.0
      counter-trend-bounce-only: true
      counter-trend-max-distance-points: 5
      counter-trend-require-confirm: true
      event-calendar-enabled: true
      event-calendar-file: data/trend-event-calendar.json
      event-block-minutes-before: 45
      event-block-minutes-after: 30
      us-oil-context: true             # WTI CL=F на trend desk (Yahoo, не ISS)
      us-oil-filter: true              # ждать открытие, если ночной ход CL крупный
      us-oil-min-abs-pct: 1.2
      us-oil-wait-minutes: 45          # поверх session-edge 20 мин; Exclusive сторону не крутим
      br:
        zone-min-points: 15
        zone-max-points: 20
        stop-points: 20              # checklist BR=20 (15–20 table); pad only via explicit override
        tp1-points: 20
        rub-per-point: 7.0
        sl-sweep-buffer-points: 5    # за day-полкой +5 пт против ложного SWEEP; иначе skip если > stop-points
    calendar-arb:
      enabled: true
      auto-execution: true          # fair-paper fills on T-Invest H1 close
      live-execution: true          # две ноги FORTS market у T-Invest (нужен broker armed + без kill-switch)
      families: BR,SI,RI,GD,NG
      default-family: BR
      fly-enabled: true              # 1:-2:1 near/mid/far рядом с calendar
      ng-seasonality: true           # NG: не фадить зимнюю премию / летний дисконт
      dv01-hedge: true               # лоты по basicAssetSize брокера (обычно 1:1)
      event-blackout: true           # EIA / CBR / див / FOMC из того же JSON, что trend
      event-calendar-file: data/trend-event-calendar.json
      event-block-minutes-before: 45
      event-block-minutes-after: 30
      event-session-blackout: true   # весь день inventory/CBR/див/gold — не открываем
      flatten-on-event: true         # открытое — закрыть в окно события
      fnd-lead-days: 0               # 0 = BR/NG 2д, остальные 1д до LTD
      squeeze-dte: 10                # не шортить near в окно поставки
      max-go-rub: 25000              # сумма ГО ног с брокера; 0 = выкл
      slippage-ticks-per-leg: 2      # paper fill против нас
      oos-days: 40                   # хвост H1 = OOS штамп replay (hist DOM из broker-tape если есть)
      spread-go-factor: 0.55         # оценка скидки ГО спреда vs сумма ног (не НКЦ)
      min-book-lots: 3               # топ двух стаканов
      book-filter: true
      partial-fills: true            # paper: сначала near; FAR только при стакане, иначе orphan EXIT
      max-partial-bars: 2            # NEAR_ONLY дольше N H1 → EXIT_PARTIAL
      eia-surprise-kbbl: 3000        # FRED WCESTUS1 vs street/ср.4н
      eia-consensus-url: ""          # optional JSON {kbbl,source}; else data/eia-consensus.json
      cftc-net-abs-block: 250000     # CFTC noncomm net |x| → SKIP_MACRO на BR; 0=off
      crack-abs-usd-block: 40        # |3-2-1 crack| USD/bbl → SKIP_MACRO на BR; 0=off
      lookback-bars: 120
      entry-z: 2.0
      exit-z: 0.40
      stop-z: 3.5
      min-near-dte: 10
      flatten-dte: 5
      lots: 1
      max-open-spreads: 1
      warmup-days: 40
      require-z-recede: true
      max-entry-z: 0                 # 0 = stopZ−0.4; не входить в хвост к стопу
      time-stop-bars: 24             # ~2 сессии H1 без возврата → выход
      max-slope-sigma: 2.2           # |t| наклона кривой — не фадить структуру
      min-edge-rub: 80               # ход к среднему должен покрыть 2 ноги
      min-avg-volume: 8
      max-half-life-bars: 72         # слишком медленный AR(1) не торгуем
      trade-session-open: "10:00"
      trade-session-close: "19:00"
      no-trade-after-open-minutes: 20
      no-trade-before-close-minutes: 30
  # Marketplace live DOM/trades — T-Invest only (no ISS tape).
  marketdata:
    enabled: true
    provider: T_INVEST
    # token falls back to imoex.broker.token / data/broker-ui-settings.json
    sandbox: false   # market data from prod API (trading may stay sandbox)
    tape-capacity: 50000              # bounded RAM tape; desk/footprint use recent window
    orderbook-depth: 50   # T-Invest max (allowed: 10/20/30/40/50)
    # hist DOM = our archive data/broker-tape/dom-*.jsonl (broker has no hist DOM API)
    auto-resolve-instrument: BRU6
    # instruments: BRU6=FIGI…   # optional override; else auto-resolve future ticker

# Продуктовый бренд (стратегии 2–3 + marketdata — модули; live пока pairs)
trinity:
  name: TRINITY Multi-Strategy Arbitrage
  version: 1.0.0
  slogan: "Three Strategies. One Mission."
  strategies:
    - cointegration
    # - trend
    # - futures-arbitrage

server:
  port: 8080

spring:
  application:
    name: trinity
  config:
    # Repo-root local secrets when running from root or from trinity-app/
    import: >-
      optional:file:./application-local.yml,
      optional:file:./config/application-local.yml,
      optional:file:../application-local.yml,
      optional:file:../config/application-local.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

analysis:
  schedule:
    enabled: false
    cron: "0 0 6 * * SUN"
